name: Auto-merge after Gemini approval

# Trigger only when Gemini submits an approval review
on:
  pull_request_review:
    types: [submitted]

jobs:
  auto-merge-on-approval:
    # Only merge if Gemini approves (state: APPROVED)
    if: |
      github.event.review.user.login == 'gemini-code-assist' &&
      github.event.review.state == 'APPROVED'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Check PR mergeability
        uses: actions/github-script@v7
        id: pr_check
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            core.setOutput('mergeable', pr.data.mergeable);
            core.info(`PR mergeable: ${pr.data.mergeable}`);

      - name: Auto-merge PR
        if: steps.pr_check.outputs.mergeable == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                merge_method: 'squash',
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '✅ Gemini approved! PR automatically merged.',
              });
            } catch (err) {
              core.warning(`Merge failed: ${err.message}`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `⚠️ Could not auto-merge: ${err.message}. Manual merge needed.`,
              });
            }
