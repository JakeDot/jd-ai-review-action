name: Condense Multiplexed Review Comments

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

jobs:
  condense-reviews:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Condense outdated reviews from tracked reviewers
        uses: actions/github-script@v7
        with:
          script: |
            // Exact reviewer IDs to track (not substring matching)
            const trackedReviewers = new Set([
              'gemini-code-assist',
              'copilot-pull-request-reviewer[bot]',
              'copilot'
            ]);

            // Get all reviews
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            // Group reviews by exact reviewer match
            const reviewsByUser = {};
            reviews.data.forEach(review => {
              const login = review.user.login;
              // Only track exact matches
              if (trackedReviewers.has(login)) {
                if (!reviewsByUser[login]) reviewsByUser[login] = [];
                reviewsByUser[login].push(review);
              }
            });

            // Log but don't dismiss - just inform about duplicates
            let condensed = 0;
            for (const [user, userReviews] of Object.entries(reviewsByUser)) {
              if (userReviews.length > 1) {
                const sorted = userReviews.sort((a, b) =>
                  new Date(b.submitted_at) - new Date(a.submitted_at)
                );

                // Report outdated reviews
                for (let i = 1; i < sorted.length; i++) {
                  const review = sorted[i];
                  core.info(`Found outdated review #${review.id} from ${user} (latest: #${sorted[0].id})`);
                  condensed++;
                }
              }
            }

            core.info(`Review scan complete: found ${condensed} outdated reviews`);
