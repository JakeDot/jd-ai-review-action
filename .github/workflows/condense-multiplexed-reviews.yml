name: Condense Multiplexed Review Comments

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

jobs:
  condense-reviews:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Minimize outdated reviews from all reviewers
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reviewerIds = ['gemini-code-assist', 'copilot-pull-request-reviewer'];
            
            // Get all reviews
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            // Group by reviewer and minimize old ones
            const reviewsByUser = {};
            reviews.data.forEach(review => {
              const login = review.user.login;
              if (reviewerIds.some(id => login.includes(id))) {
                if (!reviewsByUser[login]) reviewsByUser[login] = [];
                reviewsByUser[login].push(review);
              }
            });
            
            // Minimize all but the latest review from each user
            for (const [user, userReviews] of Object.entries(reviewsByUser)) {
              if (userReviews.length > 1) {
                const sorted = userReviews.sort((a, b) => 
                  new Date(b.submitted_at) - new Date(a.submitted_at)
                );
                
                for (let i = 1; i < sorted.length; i++) {
                  const review = sorted[i];
                  if (review.state !== 'DISMISSED') {
                    try {
                      await github.rest.pulls.dismissReview({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        pull_number: context.issue.number,
                        review_id: review.id,
                        message: `Outdated review from ${user}. Latest review: #${sorted[0].id}`,
                      });
                      
                      core.info(`Minimized outdated review ${review.id} from ${user}`);
                    } catch (err) {
                      core.warning(`Failed to minimize review: ${err.message}`);
                    }
                  }
                }
              }
            }
            
            core.info('Review condensing complete');
