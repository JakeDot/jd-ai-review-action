name: Create PR if needed

# DEPRECATED: Leftover bootstrap workflow. Use GitHub UI to create PRs.
# Kept for reference but schedule removed (was running every 5 minutes = spam)
on:
  workflow_dispatch:  # Manual trigger only

jobs:
  create-or-update-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: claude/tender-allen-a78cL

      - name: Check if PR exists
        id: check_pr
        uses: actions/github-script@v7
        with:
          script: |
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: 'JakeDot:claude/tender-allen-a78cL',
            });
            
            if (prs.data.length > 0) {
              core.setOutput('pr_exists', 'true');
              core.setOutput('pr_number', prs.data[0].number);
            } else {
              core.setOutput('pr_exists', 'false');
            }

      - name: Create PR
        if: steps.check_pr.outputs.pr_exists == 'false'
        id: create_pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Merge claude-setup into jd-ai-review-action for unified toolkit',
              head: 'claude/tender-allen-a78cL',
              base: 'main',
              body: `## Summary

Merged \`claude-setup\` into \`jd-ai-review-action\` to create a unified toolkit combining AI-powered code review automation with multi-language build pipeline infrastructure.

## What's included

**From claude-setup:**
- Multi-language build pipeline (Java, Python, Node, Go, Rust, .NET, Scala)
- Build automation with caching and artifact handling
- Comprehensive documentation and examples
- Auto-merge workflow triggered by Gemini review

**Existing from jd-ai-review-action:**
- Automated Copilot and Gemini code reviews
- Review comment condensing
- Auto-fix for Gemini suggestions

## How they work together

- Use AI reviews to automate code quality checks
- Use build pipeline for multi-language compilation
- Combine both in complex CI/CD workflows

See the updated README for usage examples and integration patterns.

## PR Automation

This PR is configured to automatically:
1. Request review from @gemini-code-assist
2. Auto-merge when Gemini's review is complete

Monitoring every 5 minutes for review status.`
            });
            
            core.setOutput('pr_number', pr.data.number);
            core.setOutput('created', 'true');

      - name: Get or create PR number
        id: pr_number
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber;
            if ('${{ steps.create_pr.outputs.pr_number }}' !== '') {
              prNumber = '${{ steps.create_pr.outputs.pr_number }}';
            } else {
              prNumber = '${{ steps.check_pr.outputs.pr_number }}';
            }
            core.setOutput('number', prNumber);

      - name: Request Gemini review
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = '${{ steps.pr_number.outputs.number }}';
            
            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: parseInt(prNumber),
                reviewers: ['gemini-code-assist'],
              });
            } catch (err) {
              core.info(`Reviewer request: ${err.message}`);
            }
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(prNumber),
              body: '@gemini-code-assist please review this PR. Once your review is complete, this PR will be automatically merged.',
            });
            
            core.info(`PR #${prNumber} ready for review`);
