# Example: calling the reusable build pipeline from a child project.
#
# Copy this into the CHILD repository at .github/workflows/build.yml. The child
# does NOT need to vendor claude-setup as a submodule for this style — GitHub
# resolves the reusable workflow directly from the claude-setup repository.
#
# Replace @main with a pinned tag/SHA of claude-setup for reproducible builds.

name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    uses: JakeDot/claude-setup/.github/workflows/build-pipeline.yml@main
    with:
      # The child declares java, node and scala components and provides the
      # build calls. Everything else (toolchain setup, caching, artifacts) is
      # handled by the reusable pipeline.
      components: |
        [
          {
            "name": "api-java",
            "language": "java",
            "version": "21",
            "workdir": "services/api",
            "cache": "maven",
            "build": "mvn -B -ntp clean package",
            "test": "mvn -B -ntp test",
            "artifacts": "services/api/target/*.jar"
          },
          {
            "name": "web-node",
            "language": "node",
            "version": "20",
            "workdir": "apps/web",
            "cache": "npm",
            "setup": "npm ci",
            "build": "npm run build",
            "test": "npm test --if-present",
            "artifacts": "apps/web/dist/**"
          },
          {
            "name": "engine-scala",
            "language": "scala",
            "version": "21",
            "workdir": "modules/engine",
            "cache": "sbt",
            "build": "sbt -batch compile",
            "test": "sbt -batch test",
            "artifacts": "modules/engine/target/**/*.jar"
          }
        ]
